[package]
entrypoint = "src/lib.typ"
name = "chiral-thesis-fhe"
version = "0.1.0"
compiler = "0.13.0"
authors = ["tinger <tinger@tinger.dev>"]
repository = "https://github.com/tingerrr/chiral-thesis-fhe"
description = "A template for theses at the Univeristy of Applied Sciences Erfurt"
keywords = ["FH", "FHE", "Fachhochschule", "Univeristy of Applied Sciences", "Erfurt"]
categories = ["thesis", "report"]
license = "MIT"
exclude = [
  "assets/fonts/",
  "assets/thumbnail/",
  "assets/watermark/",
  "doc/",
  "tests/",
  "Justfile",
  "README.md",
]

[template]
path = "template"
entrypoint = "thesis.typ"
thumbnail = "assets/thumbnail.png"
